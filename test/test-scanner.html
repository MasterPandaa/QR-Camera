<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>QR Camera - Built-in Test Scanner</title>
  <style>
    :root {
      --bg: #0b0f19;
      --card: #131b2e;
      --border: rgba(255, 255, 255, 0.1);
      --red: #e10600;
      --green: #22c55e;
      --blue: #38bdf8;
      --text: #f8fafc;
      --muted: #94a3b8;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 30px 20px;
    }
    .container {
      max-width: 840px;
      width: 100%;
      display: flex;
      flex-direction: column;
      gap: 20px;
    }
    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid var(--border);
      padding-bottom: 16px;
    }
    .title-group h1 {
      font-size: 22px;
      font-weight: 700;
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .badge {
      font-size: 11px;
      font-weight: 700;
      padding: 3px 8px;
      border-radius: 6px;
      background: rgba(225, 6, 0, 0.2);
      color: #ff6b66;
      border: 1px solid rgba(225, 6, 0, 0.4);
    }
    .video-card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 14px;
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }
    .video-viewport {
      position: relative;
      background: #000;
      width: 100%;
      height: 440px;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    video {
      width: 100%;
      height: 100%;
      object-fit: contain;
    }
    .overlay-guide {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 260px;
      height: 260px;
      border: 2px dashed rgba(255, 255, 255, 0.4);
      border-radius: 12px;
      pointer-events: none;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .overlay-laser {
      position: absolute;
      width: 100%;
      height: 2px;
      background: var(--red);
      box-shadow: 0 0 8px var(--red);
      animation: scanAnim 2.2s ease-in-out infinite alternate;
    }
    @keyframes scanAnim {
      0% { top: 10px; }
      100% { top: 250px; }
    }
    .controls {
      padding: 16px;
      display: flex;
      gap: 12px;
      background: rgba(11, 15, 25, 0.6);
      border-top: 1px solid var(--border);
      align-items: center;
      flex-wrap: wrap;
    }
    .btn {
      padding: 10px 18px;
      border-radius: 8px;
      border: none;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
    }
    .btn-start {
      background: var(--green);
      color: #0b0f19;
    }
    .btn-start:hover { filter: brightness(1.1); }
    .btn-stop {
      background: #475569;
      color: white;
    }
    .btn-stop:hover { background: #64748b; }
    .camera-select {
      background: var(--bg);
      border: 1px solid var(--border);
      color: var(--text);
      padding: 8px 12px;
      border-radius: 6px;
      font-size: 12px;
      flex: 1;
    }
    .results-card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .result-box {
      background: rgba(34, 197, 94, 0.1);
      border: 1px solid rgba(34, 197, 94, 0.3);
      padding: 14px;
      border-radius: 8px;
      font-family: monospace;
      font-size: 16px;
      color: #4ade80;
      word-break: break-all;
    }
    .logs-box {
      background: var(--bg);
      border: 1px solid var(--border);
      padding: 12px;
      border-radius: 8px;
      max-height: 140px;
      overflow-y: auto;
      font-family: monospace;
      font-size: 12px;
      color: var(--muted);
      display: flex;
      flex-direction: column;
      gap: 4px;
    }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <div class="title-group">
        <h1>🎥 Test Scanner Barcode / QR</h1>
        <span class="badge">QA Verification</span>
      </div>
      <div>
        <small style="color:var(--muted)">Bypass Verifier Tool</small>
      </div>
    </header>

    <div class="video-card">
      <div class="video-viewport">
        <video id="videoElement" autoplay playsinline muted></video>
        <div class="overlay-guide">
          <div class="overlay-laser"></div>
        </div>
      </div>
      <div class="controls">
        <button id="btnStart" class="btn btn-start">▶ Buka Kamera</button>
        <button id="btnStop" class="btn btn-stop" disabled>⏹ Stop Kamera</button>
        <select id="cameraSelect" class="camera-select"></select>
      </div>
    </div>

    <div class="results-card">
      <h3>Hasil Barcode / QR yang Terdeteksi:</h3>
      <div id="resultText" class="result-box">Menunggu kamera aktif...</div>
      
      <div style="display:flex; justify-content:space-between; align-items:center;">
        <span style="font-size:12px; color:var(--muted)">Log Aktivitas Scanner:</span>
        <span id="scanCount" style="font-size:12px; color:var(--blue)">Total Terdeteksi: 0</span>
      </div>
      <div id="logBox" class="logs-box"></div>
    </div>
  </div>

  <script src="../content/inject.js"></script>
  <script src="test-scanner.js"></script>
</body>
</html>
